<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 便签纸渐变 -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9c4"/>
      <stop offset="100%" style="stop-color:#ffe082"/>
    </linearGradient>
    <!-- 图钉渐变 -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- 便签纸主体 -->
  <rect x="6" y="12" width="48" height="48" rx="2" ry="2"
        fill="url(#noteGrad)" stroke="#e0c060" stroke-width="1"
        filter="url(#shadow)"/>

  <!-- 折角 -->
  <polygon points="54,12 54,24 42,12" fill="#ffe082" stroke="#e0c060" stroke-width="1"/>
  <polygon points="54,12 54,22 44,12" fill="#fff3c0"/>

  <!-- 图钉 -->
  <ellipse cx="26" cy="14" rx="6" ry="5" fill="url(#pinGrad)"/>
  <ellipse cx="24" cy="12" rx="2.5" ry="2" fill="#ff8a80" opacity="0.6"/>

  <!-- 便签上的文字线条 -->
  <line x1="16" y1="28" x2="44" y2="28" stroke="#c8a050" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="16" y1="36" x2="40" y2="36" stroke="#c8a050" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="16" y1="44" x2="36" y2="44" stroke="#c8a050" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- 对勾 -->
  <polyline points="42,34 46,38 52,28" fill="none" stroke="#4caf50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
