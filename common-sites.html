<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- 导航栏样式（外部引用） -->

    <style>
        /* 仅保留常用网页本身的功能样式（原样式微调，移除与导航重复的部分） */
        * {

        body {

        /* 以下为常用网页原有样式（完全保留） */

        }

        h1 {

        }
        .sub {

        }
        .reset-btn {

        .input-group input {

            border-color: #3b82f6;

            align-items: center;

            min-width: 0;

            text-overflow: ellipsis;

            height: 30px;

<!-- 常用网页本身的业务逻辑（完全保留原始功能） -->
<script>
    // ---------- 存储与书签管理（原样保留） ----------
    const STORAGE_KEY = 'web_bookmarks_master';
    const CATEGORIES_KEY = 'web_bookmark_categories';
    const DEFAULT_CATEGORIES = ['工作', '娱乐', '学习', '生活'];
    const DEFAULT_BOOKMARKS = [
        { id: '1', name: 'GitHub 开源世界', url: 'https://github.com', category: '工作' },
        { id: '2', name: 'MDN Web 文档', url: 'https://developer.mozilla.org/zh-CN/', category: '学习' },
        { id: '3', name: 'Stack Overflow', url: 'https://stackoverflow.com', category: '工作' },
        { id: '4', name: 'Google 搜索', url: 'https://www.google.com', category: '生活' },
        { id: '5', name: 'YouTube 创意', url: 'https://www.youtube.com', category: '娱乐' },
        { id: '6', name: '知乎·知识库', url: 'https://www.zhihu.com', category: '生活' }
    ];

    let bookmarks = [];
    let categories = [];
    let currentFilter = '全部';
    let toastTimer = null;

    function showMessage(text, isError = false) {
        let toast = document.querySelector('.toast-msg');
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'toast-msg';
            document.body.appendChild(toast);
        }
        toast.textContent = text;
        toast.style.backgroundColor = isError ? '#b91c1cd9' : '#1e293bdc';
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.style.opacity = '0';
        }, 2600);
    }

    function normalizeUrl(rawUrl) {
        if (!rawUrl || rawUrl.trim() === '') return null;
        let url = rawUrl.trim();
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }
        try {
            const validUrl = new URL(url);
            if (validUrl.protocol !== 'http:' && validUrl.protocol !== 'https:') {
                throw new Error('仅支持HTTP/HTTPS链接');
            }
            return validUrl.href;
        } catch (err) {
            return null;
        }
    }

    // 书签唯一标识：规范化 URL（与后端 /api/common-sites/sync 去重逻辑保持一致）
    function urlKey(rawUrl) {
        if (!rawUrl) return '';
        let s = String(rawUrl).trim();
        if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
        try {
            const u = new URL(s);
            if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
            u.hash = '';
            return u.href;
        } catch (e) {
            return s.toLowerCase();
        }
    }

    function extractDomainFromUrl(fullUrl) {
        try {
            const urlObj = new URL(fullUrl);
            return urlObj.hostname;
        } catch(e) { return ''; }
    }

    function getFaviconUrl(websiteUrl) {
        const hostname = extractDomainFromUrl(websiteUrl);
        if (!hostname) return '';
        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=48`;
    }

    function saveToLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
    }

    // ---------- 云同步 ----------
    let cloudSyncTimer = null;
    function cloudSave() {
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => {
            fetch('/api/common-sites/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bookmarks })
            }).then(r => r.json())
              .then(d => { if (d && d.success) console.log('☁️ 常用网站已同步 ' + d.count + ' 个'); })
              .catch(() => {});
        }, 200);
    }

    function cloudPull() {
        fetch('/api/common-sites')
            .then(r => r.json())
            .then(d => {
                if (!d || !d.success || !Array.isArray(d.bookmarks)) return;
                const cloudList = d.bookmarks;
                const seen = {};
                const merged = [];
                // 以规范化 URL 为唯一标识合并：云端优先（已有记录的权威），本地仅补充云端没有的
                [...cloudList, ...bookmarks].forEach(b => {
                    const key = urlKey(b.url);
                    if (!key || seen[key]) return;
                    seen[key] = true;
                    merged.push(b);
                });
                bookmarks = merged;
                saveToLocal();
                renderGrid();
                // 合并后统一回推，让云端也完成去重
                cloudSave();
                if (cloudList.length) showMessage('☁️ 已同步 ' + bookmarks.length + ' 个常用网站');
            })
            .catch(() => {});
    }

    // ---------- 分类云同步 ----------
    let cloudCatTimer = null;
    function cloudSaveCategories() {
        clearTimeout(cloudCatTimer);
        cloudCatTimer = setTimeout(() => {
            fetch('/api/common-sites/categories/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ categories })
            }).then(r => r.json())
              .then(d => { if (d && d.success) console.log('☁️ 分类已同步 ' + d.count + ' 个'); })
              .catch(() => {});
        }, 200);
    }

    function cloudPullCategories() {
        fetch('/api/common-sites/categories')
            .then(r => r.json())
            .then(d => {
                if (!d || !d.success || !Array.isArray(d.categories)) return;
                const cloud = d.categories;
                const merged = Array.from(new Set([...cloud, ...categories]));
                categories = merged;
                saveCategoriesLocal();
                const localOnly = categories.filter(c => !cloud.includes(c));
                if (localOnly.length) cloudSaveCategories();
                renderCategories();
                renderCatModal();
            })
            .catch(() => {});
    }

    function loadBookmarks() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    bookmarks = parsed;
                    dedupeBookmarks();
                    return;
                }
            } catch(e) { console.warn(e); }
        }
        bookmarks = DEFAULT_BOOKMARKS.map(item => ({ ...item, id: String(item.id) + '_' + Date.now() }));
        saveToLocal();
    }

    // 按规范化 URL 去重（保留首次出现的记录）
    function dedupeBookmarks() {
        const seen = {};
        bookmarks = bookmarks.filter(b => {
            const key = urlKey(b.url);
            if (!key || seen[key]) return false;
            seen[key] = true;
            return true;
        });
    }

    function saveCategoriesLocal() {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    }

    function loadCategories() {
        const stored = localStorage.getItem(CATEGORIES_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    categories = parsed;
                    return;
                }
            } catch(e) { console.warn(e); }
        }
        categories = [...DEFAULT_CATEGORIES];
        saveCategoriesLocal();
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function getAllCategories() {
        const set = new Set(categories);
        bookmarks.forEach(b => { if (b.category && b.category.trim()) set.add(b.category.trim()); });
        return Array.from(set);
    }

    function renderCategories() {
        const cats = getAllCategories();
        const dl = document.getElementById('categoryList');
        if (dl) dl.innerHTML = cats.map(c => `<option value="${escapeAttr(c)}"></option>`).join('');
        const bar = document.getElementById('filterBar');
        if (bar) {
            const chips = ['全部', ...cats];
            bar.innerHTML = chips.map(c => `<button class="filter-chip ${c === currentFilter ? 'active' : ''}" data-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('');
        }
    }

    function renderGrid() {
        renderCategories();
        const gridContainer = document.getElementById('bookmarkGrid');
        const countSpan = document.getElementById('bookmarkCount');
        if (!gridContainer) return;

        const filtered = currentFilter === '全部'
            ? bookmarks
            : bookmarks.filter(b => (b.category || '').trim() === currentFilter);

        if (!filtered.length) {
            const emptyMsg = bookmarks.length
                ? '<i class="fas fa-folder-open" style="font-size: 3rem; opacity: 0.6; margin-bottom: 12px; display: block;"></i>📭 该分类下暂无网站'
                : '<i class="fas fa-folder-open" style="font-size: 3rem; opacity: 0.6; margin-bottom: 12px; display: block;"></i>📭 暂无网页汇总，点击上方「添加网页」开始收藏～';
            gridContainer.innerHTML = `<div class="empty-hint" style="grid-column:1/-1;">${emptyMsg}</div>`;
            if (countSpan) countSpan.innerHTML = `📚 ${filtered.length} 个书签`;
            return;
        }

        let cardsHtml = '';
        filtered.forEach(bookmark => {
            const displayUrl = bookmark.url.length > 45 ? bookmark.url.substring(0, 42) + '...' : bookmark.url;
            const favIconSrc = getFaviconUrl(bookmark.url);
            const safeName = escapeHtml(bookmark.name);
            const safeUrl = escapeHtml(bookmark.url);
            const cat = (bookmark.category || '').trim();
            const catBadge = cat ? `<span class="cat-badge">${escapeHtml(cat)}</span>` : '';
            cardsHtml += `
                <div class="card" data-id="${bookmark.id}" data-url="${escapeAttr(bookmark.url)}">
                    <div class="delete-btn" data-id="${bookmark.id}" title="删除书签">
                        <i class="fas fa-trash-alt"></i>
                    </div>
                    <div class="card-content">
                        <div class="icon-wrapper">
                            <img class="site-icon" src="${favIconSrc}" alt="icon" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fas fa-globe fallback-icon\'></i>';">
                        </div>
                        <div class="info">
                            <div class="site-name-row">
                                <div class="site-name">${safeName}</div>
                                ${catBadge}
                            </div>
                            <div class="site-url" title="${safeUrl}">${escapeHtml(displayUrl)}</div>
                        </div>
                    </div>
                </div>
            `;
        });
        gridContainer.innerHTML = cardsHtml;
        if (countSpan) {
            countSpan.innerHTML = currentFilter === '全部'
                ? `📖 共 ${bookmarks.length} 个常用网站`
                : `📖 ${currentFilter} · ${filtered.length} 个`;
        }
    }

    function addBookmark(name, rawUrl, category) {
        if (!name || name.trim() === '') {
            showMessage('❌ 请填写网站名称', true);
            return false;
        }
        const trimmedName = name.trim();
        const normalized = normalizeUrl(rawUrl);
        if (!normalized) {
            showMessage('❌ 网址无效，请以 http:// 或 https:// 开头或输入正确域名', true);
            return false;
        }
        const existing = bookmarks.find(b => urlKey(b.url) === urlKey(normalized));
        if (existing) {
            showMessage(`⚠️ "${existing.name}" 已经存在，不要重复添加`, true);
            return false;
        }
        const newId = Date.now().toString() + '-' + Math.random().toString(36).substring(2, 6);
        const newBookmark = { id: newId, name: trimmedName, url: normalized, category: (category || '').trim() };
        bookmarks.push(newBookmark);
        saveToLocal();
        cloudSave();
        renderGrid();
        showMessage(`✅ 成功添加「${trimmedName}」`, false);
        return true;
    }

    function deleteBookmarkById(id) {
        const targetIndex = bookmarks.findIndex(b => b.id === id);
        if (targetIndex === -1) return false;
        const removedName = bookmarks[targetIndex].name;
        bookmarks.splice(targetIndex, 1);
        saveToLocal();
        cloudSave();
        renderGrid();
        showMessage(`🗑️ 已移除「${removedName}」`, false);
        return true;
    }

    function resetToDefault() {
        if (confirm('⚠️ 重置将会删除当前所有自定义网页，恢复默认常用网站示例。\n确定要继续吗？')) {
            bookmarks = DEFAULT_BOOKMARKS.map((item, idx) => ({ ...item, id: `def_${Date.now()}_${idx}` }));
            saveToLocal();
            cloudSave();
            renderGrid();
            showMessage('✨ 已恢复默认网页汇总', false);
        }
    }

    // ---------- 分类管理 ----------
    function renderCatModal() {
        const list = document.getElementById('catList');
        if (!list) return;
        if (!categories.length) {
            list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:1rem;">暂无分类，先在上方添加一个吧</div>';
            return;
        }
        list.innerHTML = categories.map(name => {
            const count = bookmarks.filter(b => (b.category || '').trim() === name).length;
            return `<li class="cat-item">
                <span class="cat-name">${escapeHtml(name)}</span>
                <span class="cat-count">${count} 个</span>
                <button class="cat-act edit" data-name="${escapeAttr(name)}" title="重命名"><i class="fas fa-pen"></i></button>
                <button class="cat-act del" data-name="${escapeAttr(name)}" title="删除"><i class="fas fa-trash-alt"></i></button>
            </li>`;
        }).join('');
    }

    function openCatModal() {
        renderCatModal();
        document.getElementById('categoryModal').style.display = 'flex';
    }

    function closeCatModal() {
        document.getElementById('categoryModal').style.display = 'none';
    }

    function addCategory(name) {
        const trimmed = (name || '').trim();
        if (!trimmed) { showMessage('❌ 请输入分类名称', true); return false; }
        if (categories.includes(trimmed)) { showMessage('⚠️ 分类「' + trimmed + '」已存在', true); return false; }
        categories.push(trimmed);
        saveCategoriesLocal();
        cloudSaveCategories();
        renderCategories();
        renderCatModal();
        showMessage('✅ 已添加分类「' + trimmed + '」');
        return true;
    }

    function renameCategory(oldName, newName) {
        const trimmed = (newName || '').trim();
        if (!trimmed) { showMessage('❌ 分类名不能为空', true); return false; }
        if (trimmed === oldName) return true;
        if (categories.includes(trimmed)) { showMessage('⚠️ 分类「' + trimmed + '」已存在', true); return false; }
        const idx = categories.indexOf(oldName);
        if (idx !== -1) categories[idx] = trimmed;
        bookmarks.forEach(b => { if ((b.category || '').trim() === oldName) b.category = trimmed; });
        saveCategoriesLocal();
        saveToLocal();
        cloudSaveCategories();
        cloudSave();
        if (currentFilter === oldName) currentFilter = trimmed;
        renderCategories();
        renderGrid();
        renderCatModal();
        showMessage('✅ 已重命名为「' + trimmed + '」');
        return true;
    }

    function deleteCategory(name) {
        const count = bookmarks.filter(b => (b.category || '').trim() === name).length;
        if (!confirm('⚠️ 确定删除分类「' + name + '」吗？\n其下 ' + count + ' 个网站将归入「未分类」。')) return false;
        categories = categories.filter(c => c !== name);
        bookmarks.forEach(b => { if ((b.category || '').trim() === name) b.category = ''; });
        saveCategoriesLocal();
        saveToLocal();
        cloudSaveCategories();
        cloudSave();
        if (currentFilter === name) currentFilter = '全部';
        renderCategories();
        renderGrid();
        renderCatModal();
        showMessage('🗑️ 已删除分类「' + name + '」');
        return true;
    }

    // 事件绑定
    function bindEvents() {
        const addBtn = document.getElementById('addBookmarkBtn');
        const nameInput = document.getElementById('siteName');
        const urlInput = document.getElementById('siteUrl');
        const categoryInput = document.getElementById('siteCategory');
        const resetBtn = document.getElementById('resetDefaultBtn');
        const grid = document.getElementById('bookmarkGrid');
        const filterBar = document.getElementById('filterBar');
        const manageCatBtn = document.getElementById('manageCatBtn');
        const catModal = document.getElementById('categoryModal');
        const closeCatModalBtn = document.getElementById('closeCatModal');
        const addCategoryBtn = document.getElementById('addCategoryBtn');
        const newCategoryInput = document.getElementById('newCategoryInput');
        const catList = document.getElementById('catList');

        const performAdd = () => {
            const name = nameInput.value;
            const url = urlInput.value;
            const category = categoryInput ? categoryInput.value : '';
            if (addBookmark(name, url, category)) {
                nameInput.value = '';
                urlInput.value = '';
                if (categoryInput) categoryInput.value = '';
                nameInput.focus();
            }
        };

        addBtn.addEventListener('click', performAdd);
        nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performAdd(); });
        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performAdd(); });
        if (categoryInput) categoryInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performAdd(); });
        resetBtn.addEventListener('click', resetToDefault);

        if (filterBar) {
            filterBar.addEventListener('click', (e) => {
                const chip = e.target.closest('.filter-chip');
                if (!chip) return;
                currentFilter = chip.getAttribute('data-cat') || '全部';
                renderGrid();
            });
        }

        // 分类管理弹窗
        if (manageCatBtn) manageCatBtn.addEventListener('click', openCatModal);
        if (closeCatModalBtn) closeCatModalBtn.addEventListener('click', closeCatModal);
        if (catModal) catModal.addEventListener('click', (e) => { if (e.target === catModal) closeCatModal(); });

        const performAddCategory = () => {
            if (addCategory(newCategoryInput.value)) newCategoryInput.value = '';
        };
        if (addCategoryBtn) addCategoryBtn.addEventListener('click', performAddCategory);
        if (newCategoryInput) newCategoryInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performAddCategory(); });

        if (catList) {
            catList.addEventListener('click', (e) => {
                const delBtn = e.target.closest('.cat-act.del');
                const editBtn = e.target.closest('.cat-act.edit');
                if (delBtn) { deleteCategory(delBtn.getAttribute('data-name')); return; }
                if (editBtn) {
                    const old = editBtn.getAttribute('data-name');
                    const newName = prompt('重命名分类「' + old + '」为：', old);
                    if (newName !== null) renameCategory(old, newName);
                }
            });
        }

        grid.addEventListener('click', (e) => {
            const delBtn = e.target.closest('.delete-btn');
            if (delBtn) {
                e.stopPropagation();
                const id = delBtn.getAttribute('data-id');
                if (id) deleteBookmarkById(id);
                return;
            }
            const card = e.target.closest('.card');
            if (card) {
                const url = card.getAttribute('data-url');
                if (url) window.open(url, '_blank', 'noopener,noreferrer');
            }
        });
    }

    // 初始化
    function init() {
        loadBookmarks();
        loadCategories();
        renderGrid();
        bindEvents();
        // 启动云同步
        setTimeout(() => { cloudPull(); cloudPullCategories(); }, 500);
        // 移动端菜单交互由 nav-loader.js 统一处理
    }
    init();
</script>
