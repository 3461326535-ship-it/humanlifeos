<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程小组件</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 50%, #5b21b6 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  padding: 20px;
}

.widget-container {
  width: 400px;
  background: #f5f3ff;
  border-radius: 24px;
  padding: 28px 32px 32px 32px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255,255,255,0.1);
}

.header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid #e0e7ff;
}

.date {
  font-size: 28px;
  font-weight: 600;
  color: #1e1b4b;
  letter-spacing: -0.5px;
}

.weekday {
  font-size: 15px;
  color: #7c3aed;
  font-weight: 500;
}

.timeline {
  position: relative;
  padding-left: 28px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 8px;
  bottom: 20px;
  width: 2px;
  background: #c7d2fe;
}

.event-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}

.event-item:last-child {
  margin-bottom: 0;
}

.event-item::before {
  content: '';
  position: absolute;
  left: -23px;
  top: 6px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 3px solid #f5f3ff;
  z-index: 1;
}

.event-item:first-child::before {
  background: #fbbf24;
}

.event-item:nth-child(2)::before {
  background: #3b82f6;
}

.event-item:nth-child(3)::before {
  background: #3b82f6;
}

.time-badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  min-width: 70px;
  text-align: center;
}

.event-item:first-child .time-badge {
  background: #fef3c7;
  color: #d97706;
}

.event-item:nth-child(2) .time-badge {
  background: #dbeafe;
  color: #2563eb;
}

.event-item:nth-child(3) .time-badge {
  background: #dbeafe;
  color: #2563eb;
}

.event-title {
  font-size: 17px;
  color: #1e1b4b;
  font-weight: 500;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <span class="date">6月28日</span>
    <span class="weekday">星期日</span>
  </div>

  <div class="timeline">
    <div class="event-item">
      <span class="time-badge">10:00</span>
      <span class="event-title">吃药</span>
    </div>
    <div class="event-item">
      <span class="time-badge">16:00</span>
      <span class="event-title">做 ads 广告组素材</span>
    </div>
    <div class="event-item">
      <span class="time-badge">17:40</span>
      <span class="event-title">写周报</span>
    </div>
  </div>
</div>

</body>
</html>
