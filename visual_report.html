<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISUN 视觉检测报告</title>
<style>
  :root {
    --bg: #f5f7fb;
    --panel: #fff;
    --text: #18202f;
    --muted: #667085;
    --line: #d8dee8;
    --accent: #155eef;
    --bad: #b42318;
    --bad-bg: #fef3f2;
    --ok: #067647;
    --ok-bg: #ecfdf3;
    --warn: #b54708;
    --warn-bg: #fffaeb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, "Microsoft YaHei", sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.96);
    padding: 16px 22px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 13px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; background: #fff; }
  .controls {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) 150px 150px 180px 160px;
    gap: 10px;
    margin-top: 14px;
  }
  input, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 9px 10px;
    background: #fff;
    color: var(--text);
  }
  main { padding: 18px 22px 32px; }
  .record {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .record-head {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .title { font-weight: 700; }
  .meta { margin-top: 5px; color: var(--muted); font-size: 12px; word-break: break-all; }
  .status {
    align-self: start;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
  }
  .status.ok { color: var(--ok); background: var(--ok-bg); }
  .status.bad { color: var(--bad); background: var(--bad-bg); }
  .status.warn { color: var(--warn); background: var(--warn-bg); }
  .shots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
  }
  .shot { background: #fff; padding: 12px; min-width: 0; }
  .shot h3 { margin: 0 0 8px; font-size: 14px; }
  .shot img {
    width: 100%;
    max-height: 560px;
    object-fit: contain;
    border: 1px solid var(--line);
    background: #f8fafc;
  }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 12px; }
  a { color: var(--accent); }
  .countline { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .page-label { display: inline-block; margin-right: 8px; color: var(--accent); font-size: 12px; font-weight: 700; }
  .analysis { padding: 12px 14px; border-top: 1px solid var(--line); }
  .analysis pre {
    margin: 8px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--muted);
    font-family: Consolas, monospace;
    font-size: 12px;
  }
  .empty { padding: 24px; color: var(--muted); }
  @media (max-width: 900px) {
    .controls { grid-template-columns: 1fr; }
    .record-head { grid-template-columns: 1fr; }
    .shots { grid-template-columns: 1fr; }
  }
</style>
</head>

</header>

const app = document.getElementById("app");
const search = document.getElementById("search");
const category = document.getElementById("category");
const device = document.getElementById("device");
const action = document.getElementById("action");
const diff = document.getElementById("diff");
const countLine = document.getElementById("countLine");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}
function pathForUrl(url) {
  try {
    const parsed = new URL(url);
    return parsed.pathname === "/" ? "/" : parsed.pathname.replace(/\/$/, "");
  } catch (err) {
    return url || "";
  }
}
function categoryForUrl(url) {
  const path = pathForUrl(url).toLowerCase();
  if (path === "/") return "Home";
  if (path.startsWith("/products/")) return path.split("/").filter(Boolean).length > 1 ? "Product Detail" : "Products";
  if (path.startsWith("/applications/")) return path.split("/").filter(Boolean).length > 1 ? "Application Detail" : "Applications";
  if (path.startsWith("/standards/")) return path.split("/").filter(Boolean).length > 1 ? "Standard Detail" : "Standards";
  if (path.startsWith("/cases/")) return path.split("/").filter(Boolean).length > 1 ? "Case Detail" : "Cases";
  if (path.startsWith("/news/")) return path.split("/").filter(Boolean).length > 1 ? "News Detail" : "News";
  if (path.startsWith("/search/")) return "Search";
  if (path.includes("404")) return "404";
  if (path.includes("privacy")) return "Privacy";
  if (path.includes("contact")) return "Contact";
  if (path.includes("about")) return "About";
  if (path.includes("e-catalog")) return "E-Catalog";
  if (path.includes("sitemap")) return "Sitemap";
  return "Other";
}
function actionGroup(item) {
  if ((item.action_key || "").startsWith("tab-")) return "Tabs";
  if ((item.action_key || "").startsWith("hover-")) return "Hover Menu";
  if (item.action_key === "mobile-menu") return "Mobile Menu";
  return item.action_label || "Direct";
}
const ENRICHED = RECORDS.map(item => ({
  ...item,
  category: categoryForUrl(item.source_url1),
  path: pathForUrl(item.source_url1),
  actionGroup: actionGroup(item)
}));
function fillSelect(select, values) {
  values.forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });
}
fillSelect(category, [...new Set(ENRICHED.map(item => item.category))].sort());
fillSelect(action, [...new Set(ENRICHED.map(item => item.actionGroup))].sort());
function resultClass(cmp) {
  if (cmp?.has_obvious_difference === true) return "bad";
  if (cmp?.status === "ok") return "ok";
  return "warn";
}
function resultText(cmp) {
  if (cmp?.has_obvious_difference === true) return "明显差异";
  if (cmp?.status === "ok") return "无明显差异";
  if (cmp?.status === "skipped") return "未分析";
  return "分析失败";
}
function shotHtml(side, label) {
  const local = side.local_path ? side.local_path.replaceAll("\\", "/") : "";
  const src = side.public_url || local;
  const localLink = local ? `<a href="${esc(local)}" target="_blank">本地图片</a>` : "";
  const publicLink = side.public_url ? `<a href="${esc(side.public_url)}" target="_blank">WordPress 媒体</a>` : "";
  const mediaLink = side.wp_media_link ? `<a href="${esc(side.wp_media_link)}" target="_blank">附件页</a>` : "";
  const error = side.error ? `<div class="meta">错误：${esc(side.error)}</div>` : "";
  return `<section class="shot"><h3>${label}</h3>${src ? `<img src="${esc(src)}" loading="lazy" alt="${label}">` : ""}<div class="links">${localLink}${publicLink}${mediaLink}</div>${error}</section>`;
}
function render() {
  const q = search.value.trim().toLowerCase();
  const c = category.value;
  const d = device.value;
  const a = action.value;
  const df = diff.value;
  const rows = ENRICHED.filter(item => {
    const cmp = item.comparison || {};
    const haystack = JSON.stringify(item).toLowerCase();
    if (q && !haystack.includes(q)) return false;
    if (c && item.category !== c) return false;
    if (d && item.device !== d) return false;
    if (a && item.actionGroup !== a) return false;
    if (df === "true" && cmp.has_obvious_difference !== true) return false;
    if (df === "false" && !(cmp.status === "ok" && cmp.has_obvious_difference !== true)) return false;
    if (df === "skipped" && cmp.status === "ok") return false;
    return true;
  });
  countLine.textContent = `显示 ${rows.length} / ${ENRICHED.length} 条；分类：${c || "全部"}；设备：${d || "全部"}；动作：${a || "全部"}`;
  app.innerHTML = rows.length ? rows.map(item => {
    const cmp = item.comparison || {};
    const issues = Array.isArray(cmp.issues) ? cmp.issues.join("\n") : "";
    return `<article class="record">
      <div class="record-head">
        <div>
          <div class="title"><span class="page-label">${esc(item.category)}</span>${esc(item.path)} / ${esc(item.device_label)} / ${esc(item.action_label)}</div>
          <div class="meta">Excel 第 ${item.row} 行 / 动作分类：${esc(item.actionGroup)}</div>
          <div class="meta">url1：<a href="${esc(item.source_url1)}" target="_blank">${esc(item.source_url1)}</a></div>
          <div class="meta">url2：<a href="${esc(item.source_url2)}" target="_blank">${esc(item.source_url2)}</a></div>
          <div class="meta">表格要求：${esc(item.instruction)}</div>
        </div>
        <div class="status ${resultClass(cmp)}">${resultText(cmp)}</div>
      </div>
      <div class="shots">${shotHtml(item.url1 || {}, "url1")}${shotHtml(item.url2 || {}, "url2")}</div>
      <div class="analysis">
        <strong>AI 结论：</strong> ${esc(cmp.summary || "")}
        ${issues ? `<pre>${esc(issues)}</pre>` : ""}
        ${cmp.raw ? `<pre>${esc(cmp.raw)}</pre>` : ""}
      </div>
    </article>`;
  }).join("") : `<div class="empty">没有符合筛选条件的记录。</div>`;
}
[search, category, device, action, diff].forEach(el => el.addEventListener("input", render));
render();
</script>
