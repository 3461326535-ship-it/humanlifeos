<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>资产管理 · 收支预算</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/nav.css">
    <style>
        :root {
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #AEAEB2;
            --border: rgba(0,0,0,0.06);
            --separator: rgba(0,0,0,0.08);
            --blue: #007AFF;
            --green: #34C759;
            --red: #FF3B30;
            --orange: #FF9500;
            --purple: #AF52DE;
            --fill-tertiary: rgba(118,118,128,0.08);
            --fill-quaternary: rgba(118,118,128,0.04);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.25s cubic-bezier(0.25,0.10,0.25,1.0);
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card-bg: #2C2C2E;
            --text: #F5F5F7;
            --text-secondary: #98989D;
            --text-tertiary: #636366;
            --border: rgba(255,255,255,0.08);
            --separator: rgba(255,255,255,0.10);
            --fill-tertiary: rgba(118,118,128,0.18);
            --fill-quaternary: rgba(118,118,128,0.10);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── 主内容区 ── */
        .main-content {
            padding: 24px 40px 24px 32px;
        }

        /* ── 页面头部 ── */
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
            margin-left: 2px;
        }

        /* ── 统计卡片行 ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow var(--transition);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); }
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat-card .stat-sub {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
        .stat-card.income .stat-value { color: var(--green); }
        .stat-card.expense .stat-value { color: var(--red); }
        .stat-card.balance .stat-value { color: var(--blue); }
        .stat-card.budget .stat-value { color: var(--orange); }

        /* ── 预算进度条 ── */
        .budget-bar-wrap {
            margin-top: 12px;
            height: 6px;
            border-radius: 3px;
            background: var(--fill-quaternary);
            overflow: hidden;
        }
        .budget-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: var(--orange);
            transition: width 0.5s ease;
        }
        .budget-bar-fill.over { background: var(--red); }

        /* ── 双栏布局 ── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr minmax(360px, 420px);
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (min-width: 1600px) {
            .two-col { grid-template-columns: 1fr 440px; }
        }
        @media (max-width: 900px) {
            .two-col { grid-template-columns: 1fr; }
            .main-content { padding: 16px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .stat-card .stat-value { font-size: 22px; }
        }

        /* ── 卡片 ── */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .card h2 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── 表单 ── */
        .form-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 80px;
        }
        .form-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.15s;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
        }
        .form-group input[type="number"] {
            width: 120px;
            -moz-appearance: textfield;
        }
        .form-group input[type="number"]::-webkit-outer-spin-button,
        .form-group input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .form-group input[type="date"] { width: 140px; }
        .form-group select { width: 100px; }

        .btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover { opacity: 0.88; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { opacity: 0.88; }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--fill-quaternary); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 6px; }

        /* ── 收支类型切换 ── */
        .type-toggle {
            display: flex;
            background: var(--fill-quaternary);
            border-radius: var(--radius-sm);
            padding: 3px;
            gap: 2px;
        }
        .type-toggle button {
            flex: 1;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.15s;
        }
        .type-toggle button.active {
            background: var(--card-bg);
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }
        .type-toggle button.active.expense-btn { color: var(--red); }
        .type-toggle button.active.income-btn { color: var(--green); }

        /* ── 交易列表 ── */
        .transaction-list {
            max-height: 420px;
            overflow-y: auto;
        }
        .transaction-list::-webkit-scrollbar { width: 4px; }
        .transaction-list::-webkit-scrollbar-thumb { background: var(--fill-tertiary); border-radius: 2px; }

        .tx-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--separator);
            gap: 12px;
            transition: background 0.1s;
        }
        .tx-item:hover { background: var(--fill-quaternary); margin: 0 -12px; padding: 12px; border-radius: 8px; }
        .tx-item:last-child { border-bottom: none; }

        .tx-cat-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: var(--fill-quaternary);
        }
        .tx-info { flex: 1; min-width: 0; }
        .tx-info .tx-title { font-weight: 500; font-size: 14px; }
        .tx-info .tx-meta {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
            display: flex;
            gap: 8px;
        }
        .tx-amount {
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
        }
        .tx-amount.income { color: var(--green); }
        .tx-amount.expense { color: var(--red); }
        .tx-delete {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.15s;
            opacity: 0;
        }
        .tx-item:hover .tx-delete { opacity: 1; }
        .tx-delete:hover { color: var(--red); background: rgba(255,59,48,0.1); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
        }
        .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.4; display: block; }

        /* ── 分类汇总 ── */
        .category-list { display: flex; flex-direction: column; gap: 10px; }
        .cat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .cat-row .cat-name { width: 70px; flex-shrink: 0; color: var(--text-secondary); font-size: 13px; }
        .cat-row .cat-bar-wrap {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: var(--fill-quaternary);
            overflow: hidden;
        }
        .cat-row .cat-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .cat-row .cat-amount { width: 90px; text-align: right; font-weight: 500; font-size: 14px; flex-shrink: 0; }
        .cat-row .cat-pct { width: 42px; text-align: right; font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }

        /* ── 预算设置弹窗 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .modal h3 { font-size: 18px; margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal .form-group input { width: 100%; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1d1d1f;
            color: #fff;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 13px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            font-weight: 500;
        }
        .toast.show { opacity: 1; }

        /* ── 页脚（合规备案） ── */
        .app-footer {
            text-align: center; padding: 16px 20px; color: #666;
            font-size: 14px; background: #ffffff; border-top: 1px solid #e5e7eb;
            margin-left: 0; width: 100%; box-sizing: border-box;
        }
        .app-footer a { color: #999; text-decoration: none; }
        .app-footer a:hover { color: #165DFF; }
        @media (max-width: 1024px) {
            .app-footer { margin-left: 0; width: 100%; }
        }

</style>
</head>
<body>

<!-- 侧边栏 -->
<div id="sidebar" class="sidebar"></div>

<!-- 主内容 -->
<div class="main-content">

    <!-- 头部 -->
    <div class="page-header">
        <h1>💰 财务管理</h1>
        <p class="subtitle">记录每一笔收支 · 掌控预算 · 理性消费</p>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card income">
            <div class="stat-label">📥 本月收入</div>
            <div class="stat-value" id="stat-income">¥0</div>
        </div>
        <div class="stat-card expense">
            <div class="stat-label">📤 本月支出</div>
            <div class="stat-value" id="stat-expense">¥0</div>
        </div>
        <div class="stat-card balance">
            <div class="stat-label">💎 本月结余</div>
            <div class="stat-value" id="stat-balance">¥0</div>
        </div>
        <div class="stat-card budget">
            <div class="stat-label">
                🎯 本月预算
                <button class="btn btn-xs btn-ghost" id="set-budget-btn" style="margin-left:8px;">设置</button>
            </div>
            <div class="stat-value" id="stat-budget">¥0</div>
            <div class="stat-sub" id="stat-budget-sub"></div>
            <div class="budget-bar-wrap"><div class="budget-bar-fill" id="budget-bar" style="width:0%"></div></div>
        </div>
    </div>

    <!-- 双栏 -->
    <div class="two-col">

        <!-- 左：记账表单 + 交易列表 -->
        <div class="card">
            <h2>📝 记一笔</h2>

            <!-- 类型切换 -->
            <div class="type-toggle" style="margin-bottom:14px;">
                <button class="active expense-btn" data-type="expense">🔻 支出</button>
                <button class="income-btn" data-type="income">🔺 收入</button>
            </div>

            <div class="form-row" style="margin-bottom:16px;">
                <div class="form-group" style="flex:1; min-width:120px;">
                    <label>金额 (¥)</label>
                    <input type="number" id="tx-amount" placeholder="0.00" step="0.01" min="0.01" style="width:100%;">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="tx-category"></select>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="tx-date">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1; min-width:150px;">
                    <label>备注（可选）</label>
                    <input type="text" id="tx-note" placeholder="例如：午餐、工资..." style="width:100%;">
                </div>
                <button class="btn btn-primary" id="add-tx-btn" style="height:42px; align-self:flex-end;">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>

            <!-- 列表 -->
            <h2 style="margin-top:24px;">📋 本月明细</h2>
            <div class="transaction-list" id="tx-list">
                <div class="empty-state">
                    <i class="fas fa-receipt"></i>
                    <p>暂无记录，开始记一笔吧～</p>
                </div>
            </div>
        </div>

        <!-- 右：分类汇总 + 快捷操作 -->
        <div style="display:flex; flex-direction:column; gap:24px;">
            <div class="card">
                <h2>📊 支出分类排行</h2>
                <div class="category-list" id="category-list">
                    <div class="empty-state" style="padding:24px;">
                        <p style="font-size:13px;">暂无支出数据</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ 快捷操作</h2>
                <div style="display:flex; flex-wrap:wrap; gap:8px;">
                    <button class="btn btn-ghost btn-sm" id="export-csv-btn">
                        <i class="fas fa-download"></i> 导出 CSV
                    </button>
                    <button class="btn btn-ghost btn-sm" id="clear-month-btn">
                        <i class="fas fa-trash"></i> 清空本月
                    </button>
                    <button class="btn btn-ghost btn-sm" id="clear-all-btn">
                        <i class="fas fa-eraser"></i> 清空全部
                    </button>
                </div>
                <p style="font-size:11px; color:var(--text-tertiary); margin-top:10px;">
                    数据存储在浏览器本地 · 不会上传服务器
                </p>
            </div>
        </div>
    </div>
</div>

<!-- 预算弹窗 -->
<div class="modal-overlay" id="budget-modal">
    <div class="modal">
        <h3>🎯 设置月度预算</h3>
        <div class="form-group">
            <label>每月预算金额 (¥)</label>
            <input type="number" id="budget-input" placeholder="例如：5000" step="0.01" min="0">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="budget-cancel">取消</button>
            <button class="btn btn-primary" id="budget-save">保存</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/js/utils.js"></script>
<script src="/js/nav-loader.js"></script>
<script>
(function() {
    'use strict';

    // ═══════════════════════════════════════════════
    // 数据模型
    // ═══════════════════════════════════════════════
    const STORAGE_KEY = 'finance_data_v1';
    const BUDGET_KEY = 'finance_budget_v1';

    // 预设分类
    const EXPENSE_CATEGORIES = [
        { id: 'food',       name: '餐饮',   icon: '🍜', color: '#FF6B6B' },
        { id: 'transport',  name: '交通',   icon: '🚗', color: '#FF9500' },
        { id: 'shopping',   name: '购物',   icon: '🛍️', color: '#AF52DE' },
        { id: 'housing',    name: '住房',   icon: '🏠', color: '#5856D6' },
        { id: 'entertain',  name: '娱乐',   icon: '🎮', color: '#FF2D55' },
        { id: 'medical',    name: '医疗',   icon: '💊', color: '#34C759' },
        { id: 'education',  name: '学习',   icon: '📚', color: '#007AFF' },
        { id: 'bills',      name: '账单',   icon: '📱', color: '#5AC8FA' },
        { id: 'other',      name: '其他',   icon: '📌', color: '#8E8E93' }
    ];

    const INCOME_CATEGORIES = [
        { id: 'salary',     name: '工资',   icon: '💼', color: '#34C759' },
        { id: 'freelance',  name: '兼职',   icon: '💻', color: '#007AFF' },
        { id: 'invest',     name: '投资',   icon: '📈', color: '#AF52DE' },
        { id: 'gift',       name: '礼金',   icon: '🎁', color: '#FF9500' },
        { id: 'other_in',   name: '其他',   icon: '📌', color: '#8E8E93' }
    ];

    let transactions = [];
    let monthlyBudget = 0;
    let currentType = 'expense'; // 'income' | 'expense'

    // ═══════════════════════════════════════════════
    // 工具函数
    // ═══════════════════════════════════════════════
    function nowDateStr() {
        const d = new Date();
        return d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
    }

    function currentMonth() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function isCurrentMonth(dateStr) {
        return dateStr.startsWith(currentMonth());
    }

    function getCatById(id) {
        const all = [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES];
        return all.find(c => c.id === id) || { name: '未知', icon: '📌', color: '#8E8E93' };
    }

    function fmtMoney(n) {
        return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    let toastTimer;
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // ═══════════════════════════════════════════════
    // 持久化
    // ═══════════════════════════════════════════════
    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            transactions = raw ? JSON.parse(raw) : [];
        } catch (e) {
            transactions = [];
        }
        try {
            monthlyBudget = parseFloat(localStorage.getItem(BUDGET_KEY)) || 0;
        } catch (e) {
            monthlyBudget = 0;
        }
    }

    // ═══════════════════════════════════════════════
    // 渲染
    // ═══════════════════════════════════════════════
    function renderCategorySelect() {
        const sel = document.getElementById('tx-category');
        const cats = currentType === 'expense' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;
        sel.innerHTML = cats.map(c =>
            '<option value="' + c.id + '">' + c.icon + ' ' + c.name + '</option>'
        ).join('');
    }

    function renderStats() {
        const monthTx = transactions.filter(t => isCurrentMonth(t.date));
        const incomeTotal = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const expenseTotal = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        const balance = incomeTotal - expenseTotal;

        document.getElementById('stat-income').textContent = fmtMoney(incomeTotal);
        document.getElementById('stat-expense').textContent = fmtMoney(expenseTotal);
        document.getElementById('stat-balance').textContent = fmtMoney(balance);

        // 预算
        document.getElementById('stat-budget').textContent = monthlyBudget > 0 ? fmtMoney(monthlyBudget) : '未设置';
        const budgetSub = document.getElementById('stat-budget-sub');
        const budgetBar = document.getElementById('budget-bar');

        if (monthlyBudget > 0) {
            const pct = Math.round(expenseTotal / monthlyBudget * 100);
            budgetSub.textContent = '已用 ' + pct + '% · 剩余 ' + fmtMoney(Math.max(0, monthlyBudget - expenseTotal));
            budgetBar.style.width = Math.min(100, pct) + '%';
            budgetBar.classList.toggle('over', expenseTotal > monthlyBudget);
        } else {
            budgetSub.textContent = '点击「设置」设定月度预算';
            budgetBar.style.width = '0%';
            budgetBar.classList.remove('over');
        }
    }

    function renderCategoryBreakdown() {
        const container = document.getElementById('category-list');
        const monthTx = transactions.filter(t => isCurrentMonth(t.date) && t.type === 'expense');
        const totalExpense = monthTx.reduce((s, t) => s + t.amount, 0);

        if (monthTx.length === 0 || totalExpense === 0) {
            container.innerHTML = '<div class="empty-state" style="padding:24px;"><p style="font-size:13px;">暂无支出数据</p></div>';
            return;
        }

        // 按分类汇总
        const catMap = {};
        monthTx.forEach(t => {
            if (!catMap[t.category]) catMap[t.category] = 0;
            catMap[t.category] += t.amount;
        });

        const sorted = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

        container.innerHTML = sorted.map(([catId, amt]) => {
            const cat = getCatById(catId);
            const pct = Math.round(amt / totalExpense * 100);
            return `
                <div class="cat-row">
                    <span class="cat-name">${cat.icon} ${cat.name}</span>
                    <div class="cat-bar-wrap">
                        <div class="cat-bar-fill" style="width:${pct}%; background:${cat.color};"></div>
                    </div>
                    <span class="cat-amount">${fmtMoney(amt)}</span>
                    <span class="cat-pct">${pct}%</span>
                </div>
            `;
        }).join('');
    }

    function renderTxList() {
        const container = document.getElementById('tx-list');
        const monthTx = transactions
            .filter(t => isCurrentMonth(t.date))
            .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

        if (monthTx.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-receipt"></i>
                    <p>暂无记录，开始记一笔吧～</p>
                </div>`;
            return;
        }

        container.innerHTML = monthTx.map(t => {
            const cat = getCatById(t.category);
            const typeClass = t.type === 'income' ? 'income' : 'expense';
            const prefix = t.type === 'income' ? '+' : '-';
            return `
                <div class="tx-item">
                    <div class="tx-cat-icon">${cat.icon}</div>
                    <div class="tx-info">
                        <div class="tx-title">${cat.name}${t.note ? ' · ' + escapeHtml(t.note) : ''}</div>
                        <div class="tx-meta">
                            <span>${t.date}</span>
                            <span>${t.type === 'income' ? '收入' : '支出'}</span>
                        </div>
                    </div>
                    <span class="tx-amount ${typeClass}">${prefix}${fmtMoney(t.amount)}</span>
                    <button class="tx-delete" data-id="${t.id}" title="删除"><i class="fas fa-times"></i></button>
                </div>
            `;
        }).join('');

        // 绑定删除事件
        container.querySelectorAll('.tx-delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                const tx = transactions.find(t => t.id === id);
                if (tx && confirm('确定删除「' + getCatById(tx.category).name + ' ' + fmtMoney(tx.amount) + '」？')) {
                    transactions = transactions.filter(t => t.id !== id);
                    saveData();
                    refreshAll();
                    showToast('已删除');
                }
            });
        });
    }

    function refreshAll() {
        renderCategorySelect();
        renderStats();
        renderCategoryBreakdown();
        renderTxList();
    }

    // ═══════════════════════════════════════════════
    // 添加交易
    // ═══════════════════════════════════════════════
    function addTransaction() {
        const amountEl = document.getElementById('tx-amount');
        const categoryEl = document.getElementById('tx-category');
        const dateEl = document.getElementById('tx-date');
        const noteEl = document.getElementById('tx-note');

        const amount = parseFloat(amountEl.value);
        if (isNaN(amount) || amount <= 0) {
            showToast('请输入有效金额');
            amountEl.focus();
            return;
        }

        const tx = {
            id: Date.now(),
            type: currentType,
            amount: Math.round(amount * 100) / 100, // 2 decimal places
            category: categoryEl.value,
            date: dateEl.value || nowDateStr(),
            note: noteEl.value.trim()
        };

        transactions.push(tx);
        saveData();

        // 清空输入
        amountEl.value = '';
        noteEl.value = '';
        amountEl.focus();

        refreshAll();
        showToast((tx.type === 'income' ? '💰 收入' : '💸 支出') + ' ' + fmtMoney(tx.amount) + ' 已记录');
    }

    // ═══════════════════════════════════════════════
    // 事件绑定
    // ═══════════════════════════════════════════════
    function bindEvents() {
        // 类型切换
        document.querySelectorAll('.type-toggle button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.type-toggle button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                renderCategorySelect();
            });
        });

        // 添加按钮
        document.getElementById('add-tx-btn').addEventListener('click', addTransaction);
        document.getElementById('tx-amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTransaction();
        });
        document.getElementById('tx-note').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTransaction();
        });

        // 预算弹窗
        const budgetModal = document.getElementById('budget-modal');
        document.getElementById('set-budget-btn').addEventListener('click', function() {
            document.getElementById('budget-input').value = monthlyBudget || '';
            budgetModal.classList.add('show');
        });
        document.getElementById('budget-cancel').addEventListener('click', function() {
            budgetModal.classList.remove('show');
        });
        document.getElementById('budget-save').addEventListener('click', function() {
            const val = parseFloat(document.getElementById('budget-input').value);
            if (isNaN(val) || val < 0) {
                showToast('请输入有效预算金额');
                return;
            }
            monthlyBudget = Math.round(val * 100) / 100;
            localStorage.setItem(BUDGET_KEY, monthlyBudget);
            budgetModal.classList.remove('show');
            renderStats();
            showToast('月度预算已设为 ' + fmtMoney(monthlyBudget));
        });
        budgetModal.addEventListener('click', function(e) {
            if (e.target === budgetModal) budgetModal.classList.remove('show');
        });

        // 导出 CSV
        document.getElementById('export-csv-btn').addEventListener('click', function() {
            if (transactions.length === 0) return showToast('暂无数据可导出');
            const header = '类型,金额,分类,日期,备注\n';
            const rows = transactions.map(t => {
                const cat = getCatById(t.category);
                return [
                    t.type === 'income' ? '收入' : '支出',
                    t.amount,
                    cat.name,
                    t.date,
                    '"' + (t.note || '').replace(/"/g, '""') + '"'
                ].join(',');
            }).join('\n');
            const blob = new Blob(['﻿' + header + rows], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '财务记录_' + currentMonth() + '.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV 已导出');
        });

        // 清空本月
        document.getElementById('clear-month-btn').addEventListener('click', function() {
            const monthTx = transactions.filter(t => isCurrentMonth(t.date));
            if (monthTx.length === 0) return showToast('本月暂无记录');
            if (confirm('确定删除本月全部 ' + monthTx.length + ' 条记录吗？此操作不可恢复。')) {
                transactions = transactions.filter(t => !isCurrentMonth(t.date));
                saveData();
                refreshAll();
                showToast('本月记录已清空');
            }
        });

        // 清空全部
        document.getElementById('clear-all-btn').addEventListener('click', function() {
            if (transactions.length === 0) return showToast('暂无任何记录');
            if (confirm('确定删除全部 ' + transactions.length + ' 条历史记录吗？此操作不可恢复。')) {
                transactions = [];
                saveData();
                refreshAll();
                showToast('全部记录已清空');
            }
        });
    }

    // ═══════════════════════════════════════════════
    // 初始化
    // ═══════════════════════════════════════════════
    function init() {
        loadData();
        document.getElementById('tx-date').value = nowDateStr();
        renderCategorySelect();
        refreshAll();
        bindEvents();
    }

    init();
})();
</script>
